<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="plantilla(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Biblioteca Horizonte</title>

    <!-- Integración de Tailwind CSS mediante CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        biblioteca: '#1e3a8a',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans leading-normal tracking-normal flex flex-col min-h-screen">

<!-- Navbar -->
<nav class="bg-biblioteca p-4 text-white shadow-md">
    <div class="container mx-auto flex justify-between items-center max-w-6xl">
        <a th:href="@{/docentes}" class="text-xl font-bold tracking-wider">BIBLIOTECA HORIZONTE</a>
        <div class="space-x-4">
            <a th:href="@{/docentes}" class="hover:text-gray-300 transition">Docentes</a>
            <!-- El enlace de pendientes para Lucía -->
            <a th:href="@{/biblioteca/pendientes}" class="hover:text-gray-300 transition">Pendientes (Lucía)</a>
        </div>
    </div>
</nav>

<!-- Contenedor dinámico -->
<main class="container mx-auto px-4 py-8 max-w-6xl flex-grow">
    <div th:replace="${contenido}"></div>
</main>

<!-- Footer -->
<footer class="bg-gray-800 text-white text-center p-4 mt-auto">
    <p class="text-sm">&copy; 2026 Biblioteca Horizonte. Todos los derechos reservados.</p>
</footer>

</body>
</html>
