<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema De Manejo De Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-2">
    <h1>LISTA DE EMPLEADOS</h1>
    <a th:href="@{/agregar}" class="btn btn-primary mb-3">Agregar Empleado</a>
    <table border="1" class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th><a th:href="@{'/pagina/' + ${pasarPagina} + '?ordenarCampo=nombre&ordenarDireccion=' + ${revertirOrden}}">Nombre Empleado</a></th>
            <th><a th:href="@{'/pagina/' + ${pasarPagina} + '?ordenarCampo=apellido&ordenarDireccion=' + ${revertirOrden}}">Apellido Empleado</a></th>
            <th><a th:href="@{'/pagina/' + ${pasarPagina} + '?ordenarCampo=email&ordenarDireccion=' + ${revertirOrden}}">Email Empleado</a></th>
            <th>ACCIONES</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="empleado : ${listaEmpleados}">
            <td th:text="${empleado.nombre}"></td>
            <td th:text="${empleado.apellido}"></td>
            <td th:text="${empleado.email}"></td>
            <td><a th:href="@{/verFormularioActualizar/{id}(id=${empleado.id})}" class="btn btn-primary">ACTUALIZAR</a>
                <a th:href="@{/eliminarEmpleado/{id}(id=${empleado.id})}" class="btn btn-danger">ELIMINAR</a></td>
        </tr>
        </tbody>
    </table>
    <div th:if="${totalPaginas > 1}">
        <div class="row col-sm-10">
            <div class="col-sm-2">
                total filas: [[${totalElementos}]]
            </div>
            <div class="col-sm-1">
                <span th:each="i: ${#numbers.sequence(1, totalPaginas)}">
                    <a th:if="${pasarPagina != i}" th:href="@{'/pagina/' + ${i} + '?ordenarCampo=' + ${ordenarCampo} + '&ordenarDireccion=' + ${ordenarDireccion}}">[[${i}]]</a>
                    <span th:unless="${pasarPagina != i}">[[${i}]]</span> &nbsp; &nbsp;
                </span>
            </div>
            <div class="col-sm-1">
                <a th:if="${pasarPagina < totalPaginas}" th:href="@{'/pagina/' + ${pasarPagina + 1} + '?ordenarCampo=' + ${ordenarCampo} + '&ordenarDireccion=' + ${ordenarDireccion}}">Siguiente</a>
                <span th:unless="${pasarPagina < totalPaginas}">Siguiente</span>
            </div>
            <div class="col-sm-1">
                <a th:if="${pasarPagina < totalPaginas}" th:href="@{'/pagina/' + ${totalPaginas} + '?ordenarCampo=' + ${ordenarCampo} + '&ordenarDireccion=' + ${ordenarDireccion}}">Atras</a>
                <span th:unless="${pasarPagina < totalPaginas}">Atras</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
