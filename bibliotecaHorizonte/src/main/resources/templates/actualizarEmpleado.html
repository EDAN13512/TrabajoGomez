<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema De Manejo De Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h1>GESTION DE EMPLEADOS</h1>
    <hr>
    <h2>Actualizar Empleado</h2>
    <form action="#" th:action="@{/guardar}" th:object="${empleado}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <input type="text" th:field="*{nombre}" class="form-control mb-4 col-4">
        <input type="text" th:field="*{apellido}" class="form-control mb-4 col-4">
        <input type="text" th:field="*{email}" class="form-control mb-4 col-4">
        <button type="submit" class="btn btn-info col-2">ACTUALIZAR</button>
    </form>
    <hr>
    <a th:href="@{/}">Volver atras</a>
</div>
</body>
</html>
