<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: plantilla('Actualizar Docente', ~{::#contenidoPrincipal})}">

  <div id="contenidoPrincipal" class="max-w-md mx-auto mt-8">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 border-t-4 border-indigo-500">
      <h2 class="text-2xl font-bold text-gray-700 mb-6 text-center">Editar Docente</h2>

      <form th:action="@{/docentes/guardar}" th:object="${docente}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">Nombre</label>
          <input type="text" th:field="*{nombre}" required
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">Apellido</label>
          <input type="text" th:field="*{apellido}" required
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="mb-6">
          <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
          <input type="email" th:field="*{email}" required
                 class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex items-center justify-between">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full transition duration-200">
            Actualizar Datos
          </button>
        </div>

        <div class="text-center mt-4">
          <a th:href="@{/docentes}" class="inline-block align-baseline font-bold text-sm text-gray-500 hover:text-gray-800 transition">
            Cancelar y volver
          </a>
        </div>
      </form>
    </div>
  </div>

</div>
</body>
</html>
